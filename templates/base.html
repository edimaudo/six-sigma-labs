<!doctype html>
<html lang="en" data-theme="dark" data-type-scale="medium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Six Sigma Labs{% endblock %}</title>
  <script>
    (function () {
      const root = document.documentElement;
      const savedTheme = localStorage.getItem('ssol-theme');
      const hasSystemPreference = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      root.dataset.theme = savedTheme || (hasSystemPreference ? 'light' : 'dark');
      root.dataset.typeScale = localStorage.getItem('ssol-type-scale') || 'medium';
    }());
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="https://cdn.plot.ly/plotly-3.6.0.min.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="shell">
<header class="header">
  <a class="brand" href="/" aria-label="Six Sigma Labs home">Six Sigma Labs</a>
  <nav class="nav" aria-label="Primary navigation">
    <a href="/diagnostic">Level check</a>
    <a href="/learn">Learn</a>
    <a href="/case-studies">Case studies</a>
    <a href="/glossary">Glossary</a>
    <a href="/math">Math</a>
    <a href="/pricing">Pricing</a>
  </nav>
  <div class="header-tools" aria-label="Display settings">
    <select id="type-scale" class="header-select" aria-label="Text and interface size">
      <option value="small">Small</option>
      <option value="medium">Medium</option>
      <option value="large">Large</option>
    </select>
    <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" aria-pressed="false">Light mode</button>
    <!-- Account UI intentionally disabled during learning-product validation. -->
    <!-- <a href="/signup">Sign up</a> -->
    <!-- <a href="/signin">Sign in</a> -->
    <!-- <form method="post" action="/signout"><button type="submit">Sign out</button></form> -->
  </div>
</header>
<main id="main-content" tabindex="-1">{% block content %}{% endblock %}</main>
<footer>Applied Six Sigma learning prototype · FastAPI · Gemini · Plotly.js</footer>
</div>
<script src="{{ url_for('static', path='app.js') }}" defer></script>
</body>
</html>
