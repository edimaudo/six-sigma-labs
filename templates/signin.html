{% extends "base.html" %}
{% block title %}Sign in · Six Sigma Operations Lab{% endblock %}
{% block content %}
<div class="container narrow">
  <section class="panel signup-card" aria-labelledby="signin-heading">
    <div class="eyebrow">Return to learning</div>
    <h1 id="signin-heading">Sign in</h1>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/signin">
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="button" type="submit">Sign in</button>
    </form>
    <p class="small">New here? <a href="/signup">Create an account</a>.</p>
  </section>
</div>
{% endblock %}
